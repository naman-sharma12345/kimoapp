name: desktop (Windows)
on:
  workflow_dispatch:
    inputs:
      release:
        description: Publish v0.4.0 only after all qualification steps pass
        type: boolean
        default: false
      full_bench_run:
        description: Successful nine-template regression run required for publication
        type: string
        default: ''
permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      KIMO_BENCH_REQUIRE_FFMPEG: '1'
      KIMO_ROBUSTNESS_CI: '1'
      KIMO_BENCH_VENDOR: ${{ github.workspace }}/desktop/vendor
      KIMO_FFMPEG: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffmpeg.exe
      KIMO_FFPROBE: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffprobe.exe
      KIMO_PERFORMANCE_PROFILE: ci
      KIMO_WORKER_THREADS: '4'
      KIMO_HW_DECODE: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/cache@v4
        with:
          path: desktop/vendor
          key: vendor-win-kimo8.12.1-whisperb5454-ffmpeg-v1
      - run: ./desktop/test/bench/bootstrap.ps1
      - name: Add bundled FFmpeg to the test PATH
        run: '"$PWD/desktop/vendor/ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix desktop
      - name: Unit, schema and Windows robustness tests
        run: npm test --prefix desktop
      - name: Build renderer
        run: npm run build:renderer --prefix desktop
      - uses: actions/upload-artifact@v4
        with:
          name: kimo-renderer-build
          path: |
            desktop/renderer/index.html
            desktop/renderer/assets/**
      - name: Playwright renderer and critical-gate UI
        run: |
          $server = Start-Process (Get-Command node).Source -ArgumentList 'desktop/test/studio-ui.mjs' -PassThru -WindowStyle Hidden -RedirectStandardOutput "$env:RUNNER_TEMP/studio-ui.log" -RedirectStandardError "$env:RUNNER_TEMP/studio-ui-error.log"
          try {
            $ready = $false
            for ($attempt=0; $attempt -lt 50; $attempt++) {
              try { Invoke-WebRequest http://127.0.0.1:8770 -TimeoutSec 2 | Out-Null; $ready=$true; break } catch { Start-Sleep -Milliseconds 200 }
            }
            if (-not $ready) { throw 'Renderer fixture server did not start' }
            node desktop/test/studio-ui-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Studio renderer checks failed' }
            node desktop/test/release-ui-check.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Release UI checks failed' }
          } finally { if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force } }
      - name: Build installer
        run: npm exec --prefix desktop -- electron-builder --projectDir desktop --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify installer, blockmap and updater feed bytes
        run: node desktop/test/verify-release.mjs desktop/dist
      - name: Install and run offline engine/captions smoke
        run: |
          $setup = Get-ChildItem desktop/dist -Filter 'kimo-Setup-*.exe' | Select-Object -First 1
          $installRoot=Join-Path $env:RUNNER_TEMP 'kimo-installed'
          $exe=Join-Path $installRoot 'kimo.exe'
          $installed=$false
          for ($attempt=1; $attempt -le 2; $attempt++) {
            $installer=Start-Process $setup.FullName -ArgumentList @('/S',('/D='+$installRoot)) -PassThru -Wait -WindowStyle Hidden
            "Installer attempt $attempt exit code: $($installer.ExitCode); target: $installRoot"
            for ($check=0; $check -lt 30; $check++) {
              if (Test-Path -LiteralPath $exe) { $installed=$true; break }
              Start-Sleep -Seconds 1
            }
            if ($installed) { break }
          }
          if (-not $installed) { throw "Installer did not create $exe; last exit code $($installer.ExitCode)" }
          Add-Type -AssemblyName System.Speech
          $speech = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $speech.SetOutputToWaveFile("$env:RUNNER_TEMP/speech.wav")
          $speech.Speak('Welcome to kimo. This is a five second test of the real engine.'); $speech.Dispose()
          & desktop/vendor/ffmpeg/ffmpeg.exe -v error -y -f lavfi -i 'testsrc2=s=1280x720:r=30:d=5' -i "$env:RUNNER_TEMP/speech.wav" -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest "$env:RUNNER_TEMP/clip.mp4"
          if ($LASTEXITCODE -ne 0) { throw 'Speech fixture encode failed' }
          $process = Start-Process $exe -ArgumentList @('--smoke',('"'+"$env:RUNNER_TEMP/clip.mp4"+'"'),'--smoke-out',('"'+"$PWD/desktop/smoke.json"+'"')) -PassThru -WindowStyle Hidden
          $null=$process.Handle
          if (-not $process.WaitForExit(30*60*1000)) { & taskkill /pid $process.Id /T /F; throw 'Installed smoke timed out' }
          Get-Content desktop/smoke.json
          if ($process.ExitCode -ne 0) { throw 'Installed engine smoke failed' }
      - uses: actions/download-artifact@v4
        with:
          run-id: 41099499282
          name: raw-v2-prepared-41099499282-TH-2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/creator-golden
      - name: Installed creator pipeline, saved-plan replay only
        env:
          BENCH_INPUT: ${{ runner.temp }}/creator-golden
          BENCH_OUTPUT: ${{ runner.temp }}/release-evidence
          BENCH_SHORT: '1'
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'kimo-installed/kimo.exe'
          foreach ($case in @(@{id='SAM-PERSON';template='shorts-punchy'},@{id='TH-2';template='youtube-talking'})) {
            $env:BENCH_CASE=$case.id; $env:BENCH_TEMPLATE=$case.template
            node desktop/test/bench/creator-release.mjs prepare
            if ($LASTEXITCODE -ne 0) { throw 'Fixture preparation failed' }
            $configuration=Join-Path "$env:BENCH_OUTPUT/$($case.id)-$($case.template)" config.json
            $process=Start-Process $exe -ArgumentList @('--creator-smoke',('"'+$configuration+'"')) -PassThru -WindowStyle Hidden
            $null=$process.Handle
            if (-not $process.WaitForExit(20*60*1000)) { & taskkill /pid $process.Id /T /F; throw 'Creator replay smoke timed out' }
            if ($process.ExitCode -ne 0) { Get-Content (Join-Path (Split-Path $configuration) smoke.json); throw 'Installed creator replay failed' }
            node desktop/test/bench/creator-release.mjs measure
            if ($LASTEXITCODE -ne 0) { throw 'Critical gates / score <75 / delivery failed' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimo-windows-qualification
          retention-days: 7
          path: |
            desktop/dist/*.exe
            desktop/dist/*.blockmap
            desktop/dist/latest.yml
            desktop/dist/release-verification.json
            desktop/smoke.json
            desktop/test/ui-shots/*.png
            ${{ runner.temp }}/release-evidence/**
            ${{ runner.temp }}/studio-ui*.log
      - name: Read version
        id: version
        run: '"v=$((Get-Content desktop/package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT'
      - name: Require the completed full-benchmark regression run
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUALIFYING_RUN: ${{ inputs.full_bench_run }}
        run: |
          if ($env:QUALIFYING_RUN -notmatch '^\d+$') { throw 'Publication requires a full_bench_run ID' }
          $qualified=$false
          for ($attempt=0; $attempt -lt 60; $attempt++) {
            $run=gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:QUALIFYING_RUN" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the full-bench run' }
            if ($run.path -ne '.github/workflows/creator-full-bench.yml') { throw 'Wrong qualification workflow' }
            if ($run.status -eq 'completed') {
              if ($run.conclusion -ne 'success') { throw 'Full benchmark did not pass' }
              $qualified=$true; break
            }
            Start-Sleep -Seconds 15
          }
          if (-not $qualified) { throw 'Full-benchmark regression run is still incomplete' }
      - name: Publish qualified release
        if: inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          name: kimo for Windows ${{ steps.version.outputs.v }} — Creator edits
          body_path: desktop/RELEASE_NOTES.md
          files: |
            desktop/dist/kimo-Setup-*.exe
            desktop/dist/kimo-Setup-*.exe.blockmap
            desktop/dist/latest.yml
          fail_on_unmatched_files: true
      - name: Verify published installer, blockmap and feed
        if: inputs.release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $published=Join-Path $env:RUNNER_TEMP 'published-release'
          New-Item -ItemType Directory -Force $published | Out-Null
          gh release download "v${{ steps.version.outputs.v }}" --repo $env:GITHUB_REPOSITORY --dir $published --pattern 'kimo-Setup-*.exe' --pattern '*.blockmap' --pattern 'latest.yml'
          if ($LASTEXITCODE -ne 0) { throw 'Published release assets could not be retrieved' }
          node desktop/test/verify-release.mjs $published
          if ($LASTEXITCODE -ne 0) { throw 'Published installer/feed verification failed' }
          foreach ($name in @('kimo-Setup-${{ steps.version.outputs.v }}.exe','kimo-Setup-${{ steps.version.outputs.v }}.exe.blockmap','latest.yml')) {
            if ((Get-FileHash -LiteralPath (Join-Path 'desktop/dist' $name) -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath (Join-Path $published $name) -Algorithm SHA256).Hash) { throw "Published bytes differ: $name" }
          }
      - uses: actions/upload-artifact@v4
        if: inputs.release && always()
        with:
          name: published-release-verification
          path: ${{ runner.temp }}/published-release/release-verification.json
          if-no-files-found: warn
