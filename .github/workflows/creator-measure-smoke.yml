name: creator saved-smoke measurement
on:
  workflow_dispatch:
    inputs:
      artifact_run:
        type: string
        default: '41466604893'
        description: Installed qualification artifact to remeasure without rendering
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      KIMO_BENCH_VENDOR: ${{ github.workspace }}/desktop/vendor
      KIMO_HW_DECODE: 'off'
      KIMO_PERFORMANCE_PROFILE: ci
      KIMO_WORKER_THREADS: '4'
      BENCH_SHORT: '1'
      BENCH_CASE: SAM-PERSON
      BENCH_TEMPLATE: shorts-punchy
      BENCH_OUTPUT: ${{ github.workspace }}/saved/_temp/release-evidence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: desktop/vendor
          key: vendor-win-kimo6.0.0-whisperb5454-ffmpeg-v1
      - shell: pwsh
        run: ./desktop/test/bench/bootstrap.ps1
      - run: npm ci --prefix desktop
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run }}
          name: kimo-windows-qualification
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved
      - run: node desktop/test/bench/creator-release.mjs measure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creator-smoke-remeasurement
          path: |
            saved/_temp/release-evidence/**/metrics.json
            saved/_temp/release-evidence/**/summary.json
            saved/_temp/release-evidence/**/review.html
            saved/_temp/release-evidence/**/CREDITS.txt
