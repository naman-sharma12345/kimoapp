name: installer hosting capability check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node desktop/test/distribution-preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-hosting-preflight
          path: distribution-evidence/
