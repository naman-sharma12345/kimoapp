name: Full-resolution raw frame-ID companions
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  instrument:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        clip: [TH-1, TH-2, TUT-1, VLOG-1, POD-1, MUSIC-1]
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      BENCH_CLIP: ${{ matrix.clip }}
      KIMO_WORKER_THREADS: '2'
      KIMO_BENCH_VENDOR: ${{ github.workspace }}/desktop/vendor
      KIMO_FFMPEG: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffmpeg.exe
      KIMO_FFPROBE: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffprobe.exe
    steps:
      - uses: actions/checkout@v4
      - run: '"KIMO_BENCH_DATA=$env:RUNNER_TEMP/kimo-bench-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: desktop/vendor
          key: vendor-win-kimo6.0.0-whisperb5454-ffmpeg-v1
      - run: ./desktop/test/bench/bootstrap.ps1
      - run: npm ci --ignore-scripts --prefix desktop
      - uses: actions/download-artifact@v4
        with:
          run-id: 41099499282
          name: raw-v2-prepared-41099499282-${{ matrix.clip }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/kimo-bench-data/raw-v2/media/${{ matrix.clip }}
      - run: node desktop/test/bench/instrument-raw.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-v2-instrumented-${{ github.run_id }}-${{ matrix.clip }}
          path: |
            ${{ runner.temp }}/kimo-bench-data/raw-v2-instrumented/${{ matrix.clip }}/**/*.json
            ${{ runner.temp }}/kimo-bench-data/raw-v2-instrumented/${{ matrix.clip }}/**/*.jsonl
            ${{ runner.temp }}/kimo-bench-data/raw-v2-instrumented/${{ matrix.clip }}/**/*.txt
            ${{ runner.temp }}/kimo-bench-data/raw-v2-instrumented/${{ matrix.clip }}/**/final.mp4
          compression-level: 0
          retention-days: 7
