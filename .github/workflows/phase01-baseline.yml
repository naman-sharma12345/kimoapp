name: Phase 01 manual baseline
on:
  workflow_dispatch:
    inputs:
      clips:
        description: 'Comma-separated golden clip IDs (one Windows job, sequential)'
        default: 'TH-1,TH-2,TUT-1,VLOG-1,POD-1,MUSIC-1'
        required: true
        type: string
      mode:
        description: 'Record once, then replay with no AI network calls'
        default: record
        type: choice
        options: [record, replay]
      aspect:
        description: 'Canvas aspects'
        default: both
        type: choice
        options: [both, '9:16', '16:9']
      label:
        description: 'Artifact label'
        default: v0.3.2-baseline
        type: string
      seed_run:
        description: 'Previous run ID containing the latest cache/data artifact'
        default: ''
        type: string
      seed_artifact:
        description: 'Exact previous artifact name'
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: phase01-manual-baseline
  cancel-in-progress: false
jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 350
    defaults:
      run:
        shell: pwsh
    env:
      KIMO_BENCH_VENDOR: ${{ github.workspace }}/desktop/vendor
      KIMO_WORKER_THREADS: '2'
      KIMO_FFMPEG: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffmpeg.exe
      KIMO_FFPROBE: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffprobe.exe
      BENCH_MODE: ${{ inputs.mode }}
      BENCH_ASPECT: ${{ inputs.aspect }}
      BENCH_LABEL: ${{ inputs.label }}
    steps:
      - uses: actions/checkout@v4
      - name: Use runner-local media storage
        run: '"KIMO_BENCH_DATA=$env:RUNNER_TEMP/kimo-bench-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/cache/restore@v4
        id: vendor
        with:
          path: desktop/vendor
          key: vendor-win-kimo6.0.0-whisperb5454-ffmpeg-v1
      - run: ./desktop/test/bench/bootstrap.ps1
      - run: npm ci --ignore-scripts --prefix desktop
      - uses: actions/cache/save@v4
        if: steps.vendor.outputs.cache-hit != 'true'
        with:
          path: desktop/vendor
          key: vendor-win-kimo6.0.0-whisperb5454-ffmpeg-v1
      - name: Restore prior record data
        if: inputs.seed_run != ''
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.seed_run }}
          name: ${{ inputs.seed_artifact }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/seed
      - name: Restore cache and exact prepared media
        if: inputs.seed_run != ''
        run: ./desktop/test/bench/restore-run.ps1 -Source "$env:RUNNER_TEMP/seed"
      - name: Fetch verified golden media
        if: inputs.mode == 'record'
        run: node desktop/test/bench/fetch-clips.mjs
      - name: ${{ inputs.mode }} TH-1
        if: ${{ !cancelled() && contains(format(',{0},', inputs.clips), ',TH-1,') }}
        run: |
          $benchArgs = @('desktop/test/bench/run.mjs','--clips','TH-1','--aspect',$env:BENCH_ASPECT,'--label',$env:BENCH_LABEL,'--max-usd','5.49','--max-requests','200')
          if ($env:BENCH_MODE -eq 'record') { $benchArgs += '--record-cache' } else { $benchArgs += '--replay-cache' }
          & node @benchArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package TH-1
        if: ${{ !cancelled() && contains(format(',{0},', inputs.clips), ',TH-1,') }}
        run: node desktop/test/bench/package-run.mjs --clip 'TH-1' --label "$env:BENCH_LABEL" --destination "$env:RUNNER_TEMP/payload-TH-1"
      - name: Save TH-1 measurements and renders
        if: ${{ !cancelled() && contains(format(',{0},', inputs.clips), ',TH-1,') }}
        uses: actions/upload-artifact@v4
        with:
          name: phase01-${{ github.run_id }}-TH-1
          path: ${{ runner.temp }}/payload-TH-1
          compression-level: 0
          retention-days: 1
      - name: ${{ inputs.mode }} TH-2
        if: ${{ !cancelled() && contains(format(',{0},', inputs.clips), ',TH-2,') }}
        run: |
          $benchArgs = @('desktop/test/bench/run.mjs','--clips','TH-2','--aspect',$env:BENCH_ASPECT,'--label',$env:BENCH_LABEL,'--max-usd','5.49','--max-requests','200')
          if ($env:BENCH_MODE -eq 'record') { $benchArgs += '--record-cache' } else { $benchArgs += '--replay-cache' }
          & node @benchArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package TH-2
