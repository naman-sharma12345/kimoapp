name: Raw timeline barcode companions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      KIMO_WORKER_THREADS: '2'
      KIMO_BENCH_VENDOR: ${{ github.workspace }}/desktop/vendor
      KIMO_FFMPEG: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffmpeg.exe
      KIMO_FFPROBE: ${{ github.workspace }}/desktop/vendor/ffmpeg/ffprobe.exe
    steps:
      - uses: actions/checkout@v4
      - run: '"KIMO_BENCH_DATA=$env:RUNNER_TEMP/kimo-bench-data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: desktop/vendor
          key: vendor-win-kimo6.0.0-whisperb5454-ffmpeg-v1
      - run: ./desktop/test/bench/bootstrap.ps1
      - run: npm ci --ignore-scripts --prefix desktop
      - run: node desktop/test/bench/calibrate-raw.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-v2-calibration-${{ github.run_id }}
          path: ${{ runner.temp }}/kimo-bench-data/raw-v2-calibration
          compression-level: 0
          retention-days: 7
