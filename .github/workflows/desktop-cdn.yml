name: installer free CDN
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: Verify the existing deployment without redeploying
        type: boolean
        default: false
      include_online:
        description: Also deploy the qualified online launcher from the published release
        type: boolean
        default: false
permissions:
  # GitHub lists draft releases only to callers with push access. This lets the
  # CDN qualify the new payload before the release becomes public/latest.
  contents: write
concurrency:
  group: desktop-installer-cdn
  cancel-in-progress: false
jobs:
  cdn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: b29c220cfa40ee9d5371b8999294b457
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test desktop/test/cdn.test.mjs
      - name: Read desktop version
        id: version
        run: echo "v=$(node -p "require('./desktop/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Guard the dedicated download hostname
        run: node desktop/distribution/guard-cdn.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Retrieve the qualified release from GitHub
        run: gh release download 'v${{ steps.version.outputs.v }}' --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/payload" --pattern 'kimo-Setup-${{ steps.version.outputs.v }}.exe' --pattern 'kimo-Setup-${{ steps.version.outputs.v }}.exe.blockmap'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve previous immutable CDN URLs and launchers
        run: |
          for prior in 0.4.0 0.4.1 0.4.2 0.4.3; do
            gh release download "v$prior" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/legacy-$prior" --pattern "kimo-Setup-$prior.exe" --pattern "kimo-Setup-$prior.exe.blockmap" --pattern "kimo-Online-Setup-$prior.exe" --pattern 'online-verification.json'
            node desktop/distribution/prepare-cdn.mjs "$RUNNER_TEMP/legacy-$prior/kimo-Setup-$prior.exe" "$RUNNER_TEMP/legacy-$prior" "desktop/distribution/payload-$prior.json"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and split the exact release into static pieces
        if: ${{ !inputs.include_online }}
        run: node desktop/distribution/prepare-cdn.mjs "$RUNNER_TEMP/payload/kimo-Setup-${{ steps.version.outputs.v }}.exe"
      - name: Retrieve and verify the qualified small launcher
        if: inputs.include_online
        run: |
          gh release download 'v${{ steps.version.outputs.v }}' --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/online" --pattern 'kimo-Online-Setup-${{ steps.version.outputs.v }}.exe' --pattern 'online-verification.json'
          node desktop/distribution/prepare-cdn.mjs "$RUNNER_TEMP/payload/kimo-Setup-${{ steps.version.outputs.v }}.exe" "$RUNNER_TEMP/online"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy only the installer distribution Worker and static assets
        if: ${{ !inputs.verify_only }}
        working-directory: desktop/distribution/cdn
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify complete and resumed public CDN downloads
        if: ${{ !inputs.include_online }}
        run: node desktop/test/verify-cdn.mjs "$RUNNER_TEMP/payload/kimo-Setup-${{ steps.version.outputs.v }}.exe"
      - name: Verify CDN payload and published launcher
        if: inputs.include_online
        run: node desktop/test/verify-cdn.mjs "$RUNNER_TEMP/payload/kimo-Setup-${{ steps.version.outputs.v }}.exe" "$RUNNER_TEMP/online"
      - name: Verify preserved previous CDN payloads and launchers
        run: |
          for prior in 0.4.0 0.4.1 0.4.2 0.4.3; do
            node desktop/test/verify-cdn.mjs "$RUNNER_TEMP/legacy-$prior/kimo-Setup-$prior.exe" "$RUNNER_TEMP/legacy-$prior" "desktop/distribution/payload-$prior.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installer-cdn-verification
          path: |
            distribution-evidence/cdn-verification*.json
            desktop/distribution/cdn/assets/manifest.json
