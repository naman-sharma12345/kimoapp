name: desktop benchmark unit tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metrics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - name: FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        if: runner.os == 'Windows'
        with:
          path: desktop/vendor
          key: vendor-win-kimo6.0.0-whisperb5454-ffmpeg-v1
      - name: Use the same bundled tools as Windows release qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./test/bench/bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Bundled tool bootstrap failed' }
          $benchFfmpegBin = "$env:GITHUB_WORKSPACE/desktop/vendor/ffmpeg"
          $benchFfmpegBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "KIMO_BENCH_VENDOR=$env:GITHUB_WORKSPACE/desktop/vendor" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm test
        env:
          KIMO_BENCH_REQUIRE_FFMPEG: '1'
