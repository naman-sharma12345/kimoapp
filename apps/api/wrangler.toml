# kimo API worker on Cloudflare's free plan (Workers + D1 only, no R2).
name = "kimo-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "api.getkimo.tech", custom_domain = true }]

[vars]
APP_ORIGIN = "https://app.getkimo.tech"
API_ORIGIN = "https://api.getkimo.tech"
COOKIE_DOMAIN = ".getkimo.tech"
# Meta Model API (OpenAI-compatible chat completions). The key itself is the
# Worker secret META_API_KEY, added in the Cloudflare dashboard, never here.
META_API_BASE_URL = "https://api.meta.ai/v1"
# muse-spark-1.3-contributor is the cheapest tier ($0.10 in / $0.20 out per 1M
# tokens, 100 RPM). Meta may train on its prompts and completions; the
# privacy and terms pages say so.
META_MODEL = "muse-spark-1.3-contributor"
# Requests with frames/audio. Contributor for testing (Naman, Oct 29 2026):
# Meta may train on them; switch to muse-spark-1.3 (no training) later.
META_MEDIA_MODEL = "muse-spark-1.3-contributor"
# Total USD cap for kimo's own Meta key (BYOK not counted).
AI_BUDGET_USD = "10"
# The real kimo v6 engine (deploy/kimo-engine) on Naman's own PC, reached through
# the free Cloudflare Tunnel "kimo-engine". Online only while his PC runs it; the
# studio falls back to the browser editor otherwise. Secret: KIMO_ENGINE_TOKEN.
KIMO_ENGINE_URL = "https://engine.getkimo.tech"

[[d1_databases]]
binding = "DB"
database_name = "kimo-api"
database_id = "bcc7c5ef-e7ac-4d3c-8afe-696b3e89cb3b"
migrations_dir = "migrations"

# Realtime rooms: SQLite-backed Durable Objects, available on Workers Free.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SessionRoom"

[[migrations]]
tag = "v1-session-rooms"
new_sqlite_classes = ["SessionRoom"]

# Secrets (set with `wrangler secret put`, never committed):
# GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
# META_API_KEY (optional; AI editing answers 503 ai_unavailable without it)

# Workers Logs stay off: requests may carry a user's own AI key in the
# X-AI-Key header, and kimo never keeps it anywhere, logs included.
[observability]
enabled = false
